name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > p.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage({ locale: "ko-KR" });
          const seen = new Set();
          p.on("request", r => { const u = r.url(); if (u.includes("kbl-api") && !seen.has(u)) { seen.add(u); console.log("REQ", u); } });
          await p.goto("https://www.kbl.or.kr/player/player/291746", { waitUntil: "networkidle", timeout: 60000 });
          const tabs = await p.$$eval("a,button,li,span", els => [...new Set(els.map(e => e.textContent.trim()).filter(t => t && t.length < 15))]);
          console.log("TEXTS", JSON.stringify(tabs).slice(0, 3000));
          for (const t of ["플레이오프", "PO", "포스트시즌", "경기별", "시즌별", "통산"]) {
            const el = p.getByText(t, { exact: true }).first();
            if (await el.count()) { console.log("CLICK", t); await el.click().catch(e => console.log("click fail", e.message)); await p.waitForTimeout(2500); }
          }
          const srcs = await p.$$eval("script[src]", s => s.map(x => x.src));
          const paths = new Set();
          for (const s of srcs) { try { const t = await (await fetch(s)).text(); for (const m of t.matchAll(/["'`]((?:players|player|Common|teams|games|records)\/[A-Za-z0-9\/\-_${}.]+)/g)) paths.add(m[1]); } catch {} }
          console.log("PATHS", JSON.stringify([...paths]));
          await b.close();
          JS
          node p.mjs

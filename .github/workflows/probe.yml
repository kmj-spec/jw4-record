name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cat > p.mjs <<'JS'
          const H={"Accept":"application/json","Origin":"https://www.kbl.or.kr","Referer":"https://www.kbl.or.kr/","User-Agent":"Mozilla/5.0"};
          const A="https://kbl-api.sports2i.com/api/v1/";
          const get=async u=>{const r=await fetch(A+u,{headers:H});return r.ok?r.json():{status:r.status}};
          const rs=await get("Common/recent-seasons?seriesCd=1");console.log("SEASONS",JSON.stringify(rs).slice(0,1500));
          for(const c of [45,47,49]){const g=await get(`players/categories/game/${c}/${c-1}/291746`);
            console.log("GAME",c,"keys",Object.keys(g));
            for(const [k,v] of Object.entries(g)) if(Array.isArray(v)) console.log("  ",k,v.length,v[0]?JSON.stringify(v[0]).slice(0,400):"");}
          JS
          node p.mjs

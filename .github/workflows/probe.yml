name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cat > p.mjs <<'JS'
          const H={"Accept":"application/json","Origin":"https://www.kbl.or.kr","Referer":"https://www.kbl.or.kr/","User-Agent":"Mozilla/5.0"};
          const A="https://kbl-api.sports2i.com/api/v1/";
          const get=async u=>{const r=await fetch(A+u,{headers:H});return r.ok?r.json():{status:r.status}};
          const show=(name,g)=>{console.log("==",name,"keys",Array.isArray(g)?"(array "+g.length+")":Object.keys(g));
            const walk=(o,pre)=>{for(const [k,v] of Object.entries(o||{})){if(Array.isArray(v)){console.log("  ",pre+k,v.length);v.forEach(x=>console.log("     ",JSON.stringify(x).slice(0,260)))}else if(v&&typeof v==="object")walk(v,pre+k+".");}};
            walk(Array.isArray(g)?{root:g}:g,"");};
          show("season",await get("players/categories/season/291746"));
          for (const s of [1,2,3,4,5]) { const r=await get(`Common/recent-seasons?seriesCd=${s}`); console.log("series",s,JSON.stringify(r).slice(0,300)); }
          JS
          node p.mjs

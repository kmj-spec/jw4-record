name: 정웅이 기록 자동 갱신

on:
  schedule:
    - cron: "7 15 * * *" # 매일 한국 시간 0시 7분(UTC 15:07). 정각은 GitHub 예약이 몰려 늦어지므로 7분으로 비킴
  workflow_dispatch:
    inputs:
      hide:
        description: "목록에서 뺄 기사 제목 (앱의 빼기 버튼이 채움)"
        required: false
        default: ""
      approve:
        description: "게시할 기사 제목 (앱의 게시 버튼이 채움)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # 브라우저(Playwright)는 KBL 직접 호출이 막혔을 때만 설치해서 다시 돌린다.
      - name: 기록 받기
        run: node scripts/fetch.mjs || { npx playwright install --with-deps chromium && node scripts/fetch.mjs; }
      - name: 기사 빼기·게시 적기
        if: ${{ inputs.hide != '' || inputs.approve != '' }}
        run: node scripts/news-edit.mjs
        env:
          HIDE: ${{ inputs.hide }}
          APPROVE: ${{ inputs.approve }}
      - name: 관련 기사 받기
        run: node scripts/news.mjs
        continue-on-error: true
      - name: 바뀐 data.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f news.json ] && git add news.json
          [ -f news-hide.json ] && git add news-hide.json
          [ -f news-ok.json ] && git add news-ok.json
          git diff --cached --quiet && { echo "바뀐 내용 없음"; exit 0; }
          git commit -m "기록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
